name: AMD development installer candidate
on:
  pull_request:
    paths:
      - '.github/workflows/amd-installer-candidate.yml'
      - 'tools/assemble_amd_candidate.py'
      - 'src/installer/**'
      - 'build_installer.py'
      - 'dependencies.lock.json'
      - 'tests/test_installer_amd_candidate.py'
      - 'qualification/providers/windows-candidate-*.json'
      - 'qualification/providers/linux-dev25/dependencies-*.lock.json'
      - 'qualification/providers/windows-dev25/dependencies-*.lock.json'
  workflow_dispatch:
    inputs:
      qualification_receipt:
        description: Repository receipt containing exact native archive and source pins
        default: qualification/providers/windows-candidate-integration.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  amd-candidate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.402'
      - name: Verify and assemble pinned Windows native inputs
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RECEIPT: ${{ inputs.qualification_receipt || 'qualification/providers/windows-candidate-integration.json' }}
        run: |
          @'
          import hashlib,json,os,pathlib,re,subprocess,sys
          selected=os.environ['CANDIDATE_RECEIPT']
          if not re.fullmatch(r'qualification/providers/windows-candidate-[a-zA-Z0-9.-]+\.json',selected):
              raise ValueError('Select a repository qualification receipt; arbitrary paths are refused')
          p=json.loads(pathlib.Path(selected).read_text())
          if p.get('selectionNeedsRebuild',False) or p.get('sourceChangedAfterSelection',False):
              print('No installer built: selected artifact needs a source-matched rebuild.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ready=false\n')
              sys.exit(0)
          stage=pathlib.Path('dist/amd');stage.mkdir(parents=True)
          artifact=stage/'native-input.zip'
          with artifact.open('wb') as out:
              subprocess.run(['gh','api',f'repos/SpinGiantCRM/mcd2-graphics/actions/artifacts/{p["artifact"]}/zip'],stdout=out,check=True)
          subprocess.run([sys.executable,'tools/assemble_amd_candidate.py','--artifact',str(artifact),
              '--archive-sha256',p['archiveSHA256'],'--source-commit',p['sourceCommit'],
              '--artifact-url',f'https://github.com/SpinGiantCRM/mcd2-graphics/actions/runs/{p["run"]}/artifacts/{p["artifact"]}',
              '--version',p['candidateVersion'],'--output',str(stage/'inputs')],check=True)
          locks=p.get('installerDependencyLocks')
          for rid in ('linux-x64','win-x64'):
              data=(stage/'inputs/dependencies.lock.json').read_bytes()
              if locks is not None:
                  lock=locks[rid]
                  if not re.fullmatch(r'qualification/providers/[a-zA-Z0-9.-]+/[a-zA-Z0-9.-]+\.json',lock['path']):
                      raise ValueError('Select a repository dependency lock; arbitrary paths are refused')
                  data=pathlib.Path(lock['path']).read_bytes()
                  if hashlib.sha256(data).hexdigest()!=lock['sha256']:
                      raise ValueError('Selected dependency lock hash mismatch')
                  json.loads(data)
              if '-integration.dev.' in p['candidateVersion']:
                  sys.path.insert(0,str(pathlib.Path.cwd()/'tools'))
                  from assemble_amd_candidate import integration_dependency_lock
                  assembled=json.loads((stage/'inputs/dependencies.lock.json').read_bytes())
                  data=(json.dumps(integration_dependency_lock(assembled,json.loads(data)),indent=2)+'\n').encode()
              (stage/f'{rid}-dependencies.lock.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ready=true\n')
          '@ | python
      - name: Build visible installer folders
        if: steps.candidate.outputs.ready == 'true'
        shell: pwsh
        run: |
          $sdk = (Get-Command dotnet).Source
          python build_installer.py --dotnet $sdk --payload dist/amd/inputs/payload --rid linux-x64 --manifest dist/amd/inputs/manifest.json --dependency-lock dist/amd/linux-x64-dependencies.lock.json --output dist/amd/installers/linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build_installer.py --dotnet $sdk --payload dist/amd/inputs/payload --rid win-x64 --manifest dist/amd/inputs/manifest.json --dependency-lock dist/amd/win-x64-dependencies.lock.json --output dist/amd/installers/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload development installers and provenance (not a release)
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amd-development-installers
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/amd/installers/**
            dist/amd/inputs/assembly-receipt.json
            dist/amd/inputs/AMD_BRIDGE_NOTICES.txt
            dist/amd/inputs/provenance/**
            dist/amd/*-dependencies.lock.json
