name: FG Windows candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select native build scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import fnmatch, os, subprocess
          patterns = ['.github/workflows/fg-windows-candidate.yml', 'experiments/fg-streamline/**', 'experiments/providers/**', 'tests/test_fsr*.py', 'tests/*fsr_startup*', 'src/native/**', 'src/gdk/**', 'build_gdk_save_bridge.py', 'src/shaders/**', 'src/latency/**', 'src/providers/**', 'src/ui/**', 'tools/ModInfoBuilder/**', 'build.py', 'build_ui.py', 'build_latency.py', 'build_amd_latency.py', 'third-party/AntiLag2/**', 'tests/amd_antilag*', 'build_toolchain.py', 'dependencies.lock.json', 'manifest.json', 'qualification/fg-release/own-payload.zip', 'qualification/fg-release/ui-build-receipt.json', 'qualification/fg-release/*.patch', 'qualification/providers/**']
          native = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          if not native:
              changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['BASE_SHA'], os.environ['HEAD_SHA']]).decode().split('\0')
              native = any(fnmatch.fnmatchcase(path, pattern) for path in changed if path for pattern in patterns)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'native={str(native).lower()}\n')
          print(f'Native build required: {native}')
          PYTHON
  build:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build pinned experimental dependencies and current FG source
        run: python experiments/fg-streamline/build_windows_candidate.py --output "$env:RUNNER_TEMP/fg-windows"
      - name: Verify failed FG startup releases native HWND ownership
        run: python tests/run_fsr_startup_failure.py --sdk "$env:RUNNER_TEMP/fg-windows/fsr-sdk" --output "$env:RUNNER_TEMP/fg-startup-failure"
      - name: Upload test binaries and build receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fg-windows-candidate
          path: ${{ runner.temp }}/fg-windows/artifact/
          retention-days: 30

  native-gate:
    name: Native candidate checks
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected build to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          if jobs['changes']['result'] != 'success':
              raise SystemExit('Native build scope selection failed.')
          selection = jobs['changes']['outputs'].get('native')
          if selection not in ('true', 'false'):
              raise SystemExit('Native build scope selection is missing or invalid.')
          expected = 'success' if selection == 'true' else 'skipped'
          if jobs['build']['result'] != expected:
              raise SystemExit(f"Native build result {jobs['build']['result']}; required {expected}.")
          print('Native candidate gate passed.')
          PYTHON
