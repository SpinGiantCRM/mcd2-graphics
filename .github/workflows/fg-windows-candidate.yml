name: FG Windows candidate
on:
  pull_request:
    paths:
      - '.github/workflows/fg-windows-candidate.yml'
      - 'experiments/fg-streamline/**'
      - 'experiments/providers/**'
      - 'tests/test_fsr*.py'
      - 'src/native/**'
      - 'src/latency/**'
      - 'src/providers/**'
      - 'src/ui/**'
      - 'tools/ModInfoBuilder/**'
      - 'build.py'
      - 'build_latency.py'
      - 'build_amd_latency.py'
      - 'third-party/AntiLag2/**'
      - 'tests/amd_antilag*'
      - 'build_toolchain.py'
      - 'dependencies.lock.json'
      - 'manifest.json'
      - 'qualification/fg-release/own-payload.zip'
      - 'qualification/fg-release/ui-build-receipt.json'
      - 'qualification/fg-release/reshade-reset-epoch.patch'
      - 'qualification/providers/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Build pinned experimental dependencies and current FG source
        run: python experiments/fg-streamline/build_windows_candidate.py --output "$env:RUNNER_TEMP/fg-windows"
      - name: Upload test binaries and build receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fg-windows-candidate
          path: ${{ runner.temp }}/fg-windows/artifact/
          retention-days: 7
