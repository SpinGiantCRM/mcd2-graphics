name: Portable checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable-checks:
    name: Linux portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Python syntax and public JSON
        run: |
          python3 -m py_compile install.py build.py build_latency.py build_installer.py build_toolchain.py test_install.py tests/make_synthetic_saves.py
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool dependencies.lock.json > /dev/null
      - name: Installer regressions
        run: python3 -m unittest discover -s tests -p "test_installer_*.py" -v
      - name: Native build recipe regressions
        run: python3 -m unittest discover -s tests -p "test_build_toolchain.py" -v
      - name: Provider baseline provenance
        run: |
          git fetch --no-tags --depth=1 origin e421e57e7667f0e9ec71e1940c6daa352a39f0c7
          python3 -m unittest discover -s tests -p "test_provider_baseline.py" -v
          python3 tools/provider_baseline.py verify
      - name: Bounded FG controller and camera checks
        run: |
          python3 -m unittest discover -s experiments/fg-streamline -p "test_*.py" -v
          python3 -m py_compile experiments/fg-streamline/*.py
          g++ -std=c++20 -Wall -Wextra -Werror experiments/fg-streamline/fg_camera_test.cpp -o /tmp/fg-camera
          /tmp/fg-camera
          g++ -std=c++20 -Wall -Wextra -Werror experiments/fg-streamline/fg_configuration_test.cpp -o /tmp/fg-configuration
          /tmp/fg-configuration
      - name: Generate synthetic parser fixtures
        run: python3 tests/make_synthetic_saves.py /tmp/mcd2-fixtures
      - name: Settings framing and semantic checks
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/provider_intent_test.cpp -o /tmp/provider-intent
          /tmp/provider-intent
          g++ -std=c++20 -Wall -Wextra -Werror tests/provider_legacy_test.cpp -o /tmp/provider-legacy
          /tmp/provider-legacy
          g++ -std=c++20 -Wall -Wextra -Werror tests/provider_store_test.cpp -o /tmp/provider-store
          python3 tests/test_provider_store_process.py /tmp/provider-store -v
          g++ -std=c++20 -Isrc/native tests/settings_bridge_test.cpp -o /tmp/settings-framing
          g++ -std=c++20 -Isrc/native tests/settings_bridge_semantic_test.cpp -o /tmp/settings-semantics
          /tmp/settings-framing /tmp/mcd2-fixtures/settings.sav
          /tmp/settings-semantics /tmp/mcd2-fixtures/settings.sav /tmp/mcd2-fixtures/runtime.sav
      - name: Unsupported adapter and pending timeout checks
        run: |
          g++ -std=c++20 -Isrc/native tests/upscaler_support_test.cpp -o /tmp/upscaler-support
          /tmp/upscaler-support
          g++ -std=c++20 -Isrc/native tests/dlss_model_override_test.cpp -o /tmp/dlss-model-override
          /tmp/dlss-model-override
          g++ -std=c++20 -Isrc/native tests/lean_borrow_lifetime_test.cpp -o /tmp/lean-borrow-lifetime
          /tmp/lean-borrow-lifetime
      - name: Display protocol and Reflex frame identity
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/wine_reflex_pacing_test.cpp -o /tmp/wine-reflex-pacing
          /tmp/wine-reflex-pacing
          g++ -std=c++20 -pthread tests/reflex_tokens_test.cpp -o /tmp/reflex-tokens
          /tmp/reflex-tokens
          g++ -std=c++20 tests/display_protocol_test.cpp -o /tmp/display-protocol
          /tmp/display-protocol /tmp/mcd2-fixtures/display-settings.sav /tmp/mcd2-fixtures/display-runtime.sav
      - name: Check frozen release reference
        run: |
          test "$(git ls-remote origin refs/tags/v0.1.0-preview.1 | cut -f1)" = 0e77429cf47eea672056986f8550ef3073937446
  windows-installer-checks:
    name: Windows installer checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Installer regressions
        run: python -m unittest discover -s tests -p "test_installer_*.py" -v
      - name: Native build recipe regressions
        run: python -m unittest discover -s tests -p "test_build_toolchain.py" -v
      - name: Provider baseline provenance
        run: |
          git fetch --no-tags --depth=1 origin e421e57e7667f0e9ec71e1940c6daa352a39f0c7
          python -m unittest discover -s tests -p "test_provider_baseline.py" -v
          python tools/provider_baseline.py verify
      - name: Provider intent contract
        shell: bash
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/provider_intent_test.cpp -o provider-intent.exe
          ./provider-intent.exe
          g++ -std=c++20 -static -Wall -Wextra -Werror tests/provider_legacy_test.cpp -o provider-legacy.exe
          ./provider-legacy.exe
          g++ -std=c++20 -static -municode -Wall -Wextra -Werror tests/provider_store_test.cpp -o provider-store.exe
          python tests/test_provider_store_process.py provider-store.exe -v
      - name: Bounded FG controller checks
        run: python -m unittest discover -s experiments/fg-streamline -p "test_*.py" -v

  guided-installer-checks:
    name: Guided installer (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: DLSS foliage ownership checks
        run: python tests/test_fg_foliage_policy.py
      - name: Guided installer file-safety checks
        run: dotnet run --project tests/installer-core/InstallerCore.Tests.csproj -c Release
      - name: Compile standalone GUI
        run: dotnet build src/installer/MCD2.Installer.csproj -c Release -p:SelfContained=false -p:RestoreLockedMode=true --nologo

  ci-gate:
    # Keep the protected check name stable and require every platform job.
    name: Portable checks
    needs: [portable-checks, windows-installer-checks, guided-installer-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()}
          for name, result in results.items():
              print(f'{name}: {result}')
          if not results or any(result != 'success' for result in results.values()):
              raise SystemExit('All Linux, Windows and guided installer checks must pass.')
          PY
