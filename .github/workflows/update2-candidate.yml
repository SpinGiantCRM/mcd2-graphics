name: Update 2 candidate installers
on:
  pull_request:
    paths:
      - 'qualification/update2/**'
      - 'src/installer/**'
      - 'build_installer.py'
      - 'manifest.json'
      - 'dependencies.lock.json'
      - 'third-party/**'
      - '.github/workflows/update2-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Extract only the qualified own payload
        run: |
          python3 qualification/update2/prepare_payload.py
      - name: Build candidate installers
        run: |
          python3 build_installer.py --dotnet "$(command -v dotnet)" --payload dist/qualified-own --rid linux-x64 --output dist/guided/linux
          python3 build_installer.py --dotnet "$(command -v dotnet)" --payload dist/qualified-own --rid win-x64 --output dist/guided/windows
      - name: Upload qualification artifacts (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: update2-candidate-installers
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/guided/linux/mcd2-graphics-installer
            dist/guided/linux/installer-build.json
            dist/guided/windows/MCD2-Graphics-Installer.exe
            dist/guided/windows/installer-build.json
