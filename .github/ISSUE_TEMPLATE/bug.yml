name: Bug report
description: Report a problem with MCD2 Graphics, including intermittent crashes
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide only information relevant to the graphics mod.

        **Remove account information, party codes, authentication data, private local paths and unrelated logs/screenshots before posting.**

        Intermittent failures are welcome even if a retry works. For a crash or black screen, follow [the reporting guide](https://github.com/SpinGiantCRM/mcd2-graphics/blob/development/amd-colour-resize/docs/REPORTING_GRAPHICS_PROBLEMS.md). Do not upload raw crash dumps or entire log folders publicly.

  - type: input
    id: mod_version
    attributes:
      label: MCD2 Graphics version
      description: Release tag or commit SHA.
      placeholder: v0.1.0-preview.1
    validations:
      required: true

  - type: input
    id: game_build
    attributes:
      label: Minecraft Dungeons II build
      description: Steam/game build if known.
      placeholder: 25647713
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Proton / Linux
        - Other
    validations:
      required: true

  - type: input
    id: platform_details
    attributes:
      label: Platform details
      description: Windows version, or Linux distribution and Proton version.
      placeholder: Proton Experimental on CachyOS
    validations:
      required: true

  - type: input
    id: gpu_driver
    attributes:
      label: GPU and driver
      placeholder: RTX 4080 SUPER / 615.71.09
    validations:
      required: true

  - type: input
    id: output
    attributes:
      label: Output resolution / aspect ratio
      placeholder: 3840x2160 / 16:9
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Reconstruction settings
      description: Upscaler, preset and custom render scale if relevant.
      placeholder: NVIDIA DLSS / Quality / 67%
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: ReShade and dependency versions
      description: Include the relevant pinned dependency versions if available.
      placeholder: ReShade version or exact candidate; Blueprint Loader version; RenoDX snapshot; any overrides
    validations:
      required: true

  - type: input
    id: rendering_state
    attributes:
      label: Frame Generation, HDR and display mode
      description: State what was selected when the problem occurred; include overlays or other graphics mods if known.
      placeholder: FG Off; HDR Off; borderless 1920x1200; Steam overlay enabled

  - type: dropdown
    id: failure_kind
    attributes:
      label: What failed?
      options:
        - Not a crash
        - Visible crash during play or focus switch
        - Black lines / corruption, game stayed running
        - Freeze or black screen
        - Crash message or Windows fault only while quitting
        - Unexpected return to main menu
        - Other / unsure

  - type: textarea
    id: occurrence
    attributes:
      label: Timing and frequency
      description: Approximate time in the session, location (menu / hub / dungeon), online or offline, and trigger (Alt-Tab out or back, resize, travel, Save and quit, or window close). Include failures/attempts if known; do not keep repeating a harmful test.
      placeholder: After about five minutes outside a dungeon, returning from Alt-Tab; once in four attempts. FSR Quality, FG Off. A later attempt worked.

  - type: textarea
    id: crash_message
    attributes:
      label: Sanitized crash message or Windows error
      description: Optional. Copy the error text/code and faulting module if available. Remove LoginId, account IDs and personal paths. Distinguish a visible gameplay crash from a fault recorded after the window closed.

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the shortest sequence you observed. If intermittent, say so; a reliable reproduction is not required to submit a report.
      placeholder: |
        1. Launch the game.
        2. Load a level.
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Include whether the mod recovered to Native rendering or remained failed.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional sanitized evidence
      description: Optional sanitized log excerpts, screenshots, timing data or other evidence. Do not upload private/authentication data.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked the current README, INSTALL.md and validation/limitations before filing this report.
          required: true
        - label: I removed account information, party codes, authentication data and private local paths from anything attached.
          required: true
